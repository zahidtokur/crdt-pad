{% extends 'base.html' %}

{% block title %}Document {{ doc_id }} - CRDT Pad{% endblock %}

{% block extra_head %}
<style>
  #messages li {
    padding: 0.6rem 0.85rem;
    background-color: #fff;
    border: 1px solid #dee2e6;
    border-radius: 0.5rem;
    word-break: break-word;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-12 col-lg-8">
    <div class="card shadow-sm border-0 rounded-4 bg-white">
      <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-file-earmark-text text-primary fs-4"></i>
          <h1 class="h5 mb-0 fw-bold">Document: <span class="text-primary">{{ doc_id }}</span></h1>
        </div>
        <span id="status" class="badge bg-secondary px-3 py-2 rounded-pill">Connecting...</span>
      </div>

      <div class="card-body p-4">
        <form id="form" class="mb-4">
          <div class="input-group">
            <input id="input" type="text" class="form-control" placeholder="Type a message..." autocomplete="off">
            <button id="send" class="btn btn-primary px-4" type="submit" disabled>
              <i class="bi bi-send me-1"></i>Send
            </button>
          </div>
        </form>

        <h6 class="fw-semibold text-secondary mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-chat-left-text"></i>Messages
        </h6>
        <div class="border rounded-3 p-3 bg-light" style="min-height: 200px; max-height: 400px; overflow-y: auto;">
          <ul id="messages" class="list-unstyled mb-0 d-flex flex-column gap-2"></ul>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const statusEl = document.getElementById('status');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendButton = document.getElementById('send');
  const messages = document.getElementById('messages');

  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${scheme}://${location.host}/ws/documents/{{ doc_id }}/`);

  ws.onopen = () => {
    statusEl.textContent = 'Connected';
    sendButton.disabled = false;
  };

  ws.onmessage = (event) => {
    const item = document.createElement('li');
    item.textContent = event.data;
    messages.appendChild(item);
  };

  ws.onclose = () => {
    statusEl.textContent = 'Disconnected';
    sendButton.disabled = true;
  };

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    ws.send(input.value);
    input.value = '';
  });
</script>
{% endblock %}
